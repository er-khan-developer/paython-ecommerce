<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My E-Commerce</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">E-Shop</a>
            <div class="d-flex text-white align-items-center">
                {% if user.is_authenticated %}
                    <span class="me-3">Hi, {{ user.first_name | capfirst }}</span>
                    <!-- Naya Link: My Orders -->
                    <a href="{% url 'my_orders' %}" class="btn btn-outline-info btn-sm me-2">My Orders</a>
                    <!-- Purane Cart link ko is naye link se replace karein -->
                    <a href="{% url 'cart' %}" class="btn btn-outline-warning btn-sm me-2">
                        Cart <span class="badge bg-danger rounded-pill" id="nav-cart-count">{{ cart_count }}</span>
                    </a>
                    <a href="{% url 'setup_2fa' %}" class="btn btn-warning me-2">Enable 2FA (Security)</a>
                    <!-- Logout ke liye post request zaroori hai (security ke liye) -->
                    <form method="post" action="{% url 'logout' %}" class="m-0">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                    </form>
                    
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Login</a>
                    <a href="{% url 'signup' %}" class="btn btn-primary btn-sm">Sign Up</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

</html>
