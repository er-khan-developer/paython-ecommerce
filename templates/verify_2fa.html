{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4 text-center">
        <div class="card shadow border-0">
            <div class="card-header bg-primary text-white py-3">
                <h5 class="mb-0"><i class="bi bi-shield-lock"></i> 2-Step Verification</h5>
            </div>
            <div class="card-body p-4">
                <p class="text-muted mb-4">Kripya apne Google Authenticator app se 6-digit ka code yahan daalein.</p>
                
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <input type="text" name="otp" class="form-control form-control-lg text-center" 
                               placeholder="000000" maxlength="6" required autofocus autocomplete="off">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
                        Verify & Login
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
